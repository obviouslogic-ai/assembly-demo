<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assembly · ObviousLogic demos</title><link rel="stylesheet" href="kit/kit.css">
<style>
.work{display:grid;grid-template-columns:1.55fr 1fr;gap:3vw}
.left{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
#amph{position:relative;min-height:0}
.seat{position:absolute;width:86px;transform:translate(-50%,-50%);text-align:center;opacity:.35;transition:opacity .5s}
.seat i{display:block;width:8px;height:8px;margin:0 auto 4px;border-radius:50%;background:var(--dim);transition:background .5s,box-shadow .5s}
.seat b{font:600 9px Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;display:block;line-height:1.2}
.seat small{font:8px/1.2 var(--mono);color:var(--dim);display:block}
.seat.on{opacity:1}.seat.support i{background:var(--ok)}.seat.doubt i{background:var(--bad)}.seat.refine i{background:var(--accent)}
.seat.speak i{box-shadow:0 0 0 6px #ffffff1c}
#say{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(440px,70%);text-align:center;font-size:15px;line-height:1.45;min-height:64px}
#say b{display:block;font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;font-weight:400;margin-bottom:4px}
#cardwrap{padding-top:8px;background:linear-gradient(var(--faint),var(--faint)) top/100% 1px no-repeat}
#card{font-size:17px;line-height:1.45;min-height:3em;transition:opacity .3s}#card.flash{opacity:.15}
#ver{color:var(--accent)}
.right{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.gate{display:grid;grid-template-columns:1fr auto;column-gap:12px;padding:4px 0;opacity:.3;transition:opacity .5s}
.gate.on{opacity:1}.gate .h{font-size:12px}.gate .st{font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.gate .bar{grid-column:1/3;height:2px;background:var(--faint);margin-top:6px;transition:background .5s}
.gate p{grid-column:1/3;font-size:12px;line-height:1.35;color:var(--dim);margin:4px 0 0}
.gate.pass .bar{background:var(--ok)}.gate.pass .st{color:var(--ok)}.gate.revise .bar{background:var(--accent)}.gate.revise .st{color:var(--accent)}.gate.fail .bar,.gate.fail .st{color:var(--bad);background:none}
.gate.fail .bar{background:var(--bad)}
#final{display:none;margin-top:10px}#final.show{display:block;animation:rise .7s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#final ul{margin:4px 0 6px;padding-left:16px;font-size:12px;color:var(--dim);line-height:1.4}#dissent{font-size:12px;color:var(--dim);margin:2px 0}
#tally span{margin-right:18px}
</style></head><body class="stage">
<main class="stage-main">
<div><div class="tele" data-kit-tele></div><h1>Twenty minds make one idea better before it costs anything</h1></div>
<div class="work">
 <div class="left"><div id="amph"><div id="say">Pick a sample idea and submit it to the Assembly.</div></div>
  <div id="cardwrap"><div class="tele">IDEA CARD <b id="ver">V0</b> &nbsp; PHASE <b id="stat">-</b> &nbsp; <span id="tally"></span></div><div id="card"></div></div></div>
 <div class="right"><div class="tele">REFINEMENT GATES / PASS · REVISE · FAIL</div><div id="track"></div>
  <div id="final"><div class="tele">FINAL / <b id="ready"></b></div><ul id="changed"></ul><div class="tele">DISSENT ON RECORD</div><p id="dissent"></p></div></div>
</div>
<div class="act"><select id="pick" aria-label="Sample idea"></select><button class="big" id="go">Submit idea to the Assembly</button><span class="verdict" id="out"></span></div>
</main>
<template id="info"><p>In Palladium, a contested idea goes to an assembly of very different thinkers. They refine it over rounds and vote, then the survivor passes a fixed set of refinement gates. Out comes a better version, what changed, and the dissent on record. This page replays two hand-written samples.</p>
<p>Seats are fictional personas <em>inspired by</em> public-domain historical figures. Their lines were written for this demo and are not quotes.</p>
<div class="tele">WHY I BUILT THIS / DRAFT, PENDING DAN'S CONFIRMATION</div>
<p>An idea gets stress-tested by many perspectives and checked against set gates before it costs anything.</p></template>
<script type="module">
import { loadAll, timeline, GATES } from "../assembly.js";
import { mount, setStatus, sleep } from "./kit/kit.js";
mount("assembly-demo", { status: "READY" });
const $ = id => document.getElementById(id);
const { personas, ideas } = await loadAll(fetch, "../"), seat = {};
$("pick").innerHTML = ideas.map((d, i) => `<option value="${i}">${d.title}</option>`).join("");
personas.forEach((p, i) => { const a = Math.PI * (1 - i / (personas.length - 1)), el = document.createElement("div");
  el.className = "seat"; const r = i % 2 ? .62 : 1; el.style.left = 50 + 46 * r * Math.cos(a) + "%"; el.style.top = 78 - 70 * r * Math.sin(a) + "%";
  el.innerHTML = `<i></i><b>${p.name.replace("The ", "")}</b><small>${p.inspired_by}</small>`; el.title = `${p.name}, inspired by ${p.inspired_by}. ${p.lens}`; $("amph").append(el); seat[p.id] = el; });
const name = id => personas.find(p => p.id === id).name;
const track = () => $("track").innerHTML = GATES.map(g => `<div class="gate"><span class="h">${g}</span><span class="st">waiting</span><div class="bar"></div><p></p></div>`).join("");
const reset = () => { track(); $("final").classList.remove("show"); $("tally").textContent = ""; $("out").textContent = ""; $("stat").textContent = "-"; $("ver").textContent = "V0";
  $("card").textContent = ideas[$("pick").value].idea; Object.values(seat).forEach(s => s.className = "seat"); $("say").textContent = "Pick a sample idea and submit it to the Assembly."; };
let busy = false;
async function play() {
  if (busy) return; busy = true; reset(); $("go").disabled = $("pick").disabled = true; setStatus("IN SESSION"); delete document.body.dataset.done;
  const idea = ideas[$("pick").value];
  for (const e of timeline(idea)) {
    if (e.kind === "card") { $("card").classList.add("flash"); await sleep(250); $("card").textContent = e.text; $("ver").textContent = "V" + e.version; $("card").classList.remove("flash"); await sleep(1100); }
    if (e.kind === "round") { $("stat").textContent = `ROUND ${e.n} / ${e.name.toUpperCase()}`; await sleep(400); }
    if (e.kind === "note") { Object.values(seat).forEach(s => s.classList.remove("speak")); seat[e.seat].classList.add("on", e.stance, "speak");
      $("say").innerHTML = `<b style="color:var(--${e.stance === "support" ? "ok" : e.stance === "doubt" ? "bad" : "accent"})">${name(e.seat)} / ${e.stance}</b>${e.text}`; await sleep(1500); }
    if (e.kind === "vote") { $("stat").textContent = "VOTE"; Object.values(seat).forEach(s => s.classList.add("on")); $("say").textContent = "All twenty seats vote.";
      $("tally").innerHTML = `<span style="color:var(--ok)">PROCEED ${e.proceed}</span><span style="color:var(--accent)">REVISE ${e.revise}</span><span style="color:var(--bad)">KILL ${e.kill}</span>`; await sleep(1400);
      $("say").textContent = "The idea survives and goes to the gates."; }
    if (e.kind === "gate") { $("stat").textContent = "GATE " + (e.n + 1) + " / " + e.gate.toUpperCase(); const g = $("track").children[e.n]; g.classList.add("on", "pulse"); await sleep(600);
      g.classList.remove("pulse"); g.classList.add(e.status); g.querySelector(".st").textContent = e.status; g.querySelector("p").textContent = e.change !== "None." ? e.change : e.finding; await sleep(900); }
    if (e.kind === "final") { $("stat").textContent = "DONE"; $("ver").textContent = "FINAL"; $("card").textContent = e.text; $("ready").textContent = e.readiness.toUpperCase();
      $("changed").innerHTML = e.changed.map(c => `<li>${c}</li>`).join(""); $("dissent").textContent = e.dissent; $("final").classList.add("show"); document.querySelectorAll(".gate p").forEach(p => p.remove());
      $("out").textContent = "Improved idea out. " + e.readiness; $("out").className = "verdict okc"; $("say").textContent = "The refined idea, what changed and the dissent are on record."; }
  }
  setStatus("DONE"); $("go").textContent = "Replay"; $("go").disabled = $("pick").disabled = false; busy = false; document.body.dataset.done = "1";
}
$("go").onclick = play; $("pick").onchange = reset; reset(); document.body.dataset.ready = "1";
</script></body></html>
